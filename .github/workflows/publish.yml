name: Publish

# Runs when a GitHub release is published. The .vsix is built once and the
# same file goes to the VS Marketplace, Open VSX and the release's assets.
#
# Both registries authenticate with trusted publishing (GitHub OIDC), so there
# are no stored secrets. Each registry has a policy naming this repository and
# this workflow file -- renaming or moving publish.yml breaks publishing until
# the policies are updated:
#   VS Marketplace: https://marketplace.visualstudio.com/manage -> publisher -> Trusted Publishing
#   Open VSX:       https://open-vsx.org/user-settings/trusted-publishers

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: Release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$version'"
            exit 1
          fi

      - name: Grammar is in sync with scripts/build-grammar.py
        run: |
          npm run grammar:build
          git diff --exit-code -- syntaxes/lcl.tmLanguage.json

      - run: npm test

      # A GitHub release marked "pre-release" ships as a pre-release extension.
      - name: Package
        env:
          PRE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          flags=()
          if [ "$PRE_RELEASE" = "true" ]; then flags+=(--pre-release); fi
          npx vsce package "${flags[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

  # The three jobs below are independent so that one failing (for example a
  # registry outage) can be retried with "Re-run failed jobs" without
  # republishing a version the other registry already accepted.

  vs-marketplace:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - run: npx vsce publish --oidc --packagePath dist/*.vsix

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - run: npx ovsx publish --trusted-publishing dist/*.vsix

  release-asset:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Attach .vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.vsix --clobber
